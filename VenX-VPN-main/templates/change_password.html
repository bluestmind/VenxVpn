<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/signup.css">
    <title>Change Password</title>
</head>
<body>
    <div id="modalWrapper" class="modal-wrapper" style="display: none;">
        <div id="modalContent" class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <p>{{ error_message }}</p>
        </div>
    </div>

    <div class="container">
        <div class="logo">
            <img src="../static/UI_Content/black%20logo.png" alt="Logo">
        </div>
        <div class="header">
            <h2> Change Password</h2>
        </div>
        <form action="/change_password" method="POST" onsubmit="return validatePasswords()">
            <input type="password" id="current_password" name="current_password" placeholder="Current Password" required>
            <input type="password" id="new_password" name="new_password" placeholder="New Password" required>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" required>
            <button type="submit" class="signup-button">Change Password</button>
        </form>
        <div class="text_create" style="margin-top: 15px;"> Want to go back? <a href="/dashboard" style="text-decoration: none; color: rgb(103, 103, 227);">Dashboard</a></div>
    </div>

    <footer>

    </footer>

    <script>
        function validatePasswords() {
            const currentPassword = document.getElementById('current_password').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            if (newPassword !== confirmPassword) {
                alert("New passwords do not match!");
                return false;
            }
            return true;
        }

        // Function to display the modal
        function displayModal() {
            var modalWrapper = document.getElementById("modalWrapper");
            modalWrapper.style.display = "block";
        }

        // Function to close the modal
        function closeModal() {
            var modalWrapper = document.getElementById("modalWrapper");
            modalWrapper.style.display = "none";
        }

        // Call displayModal function if error_message exists
        {% if error_message %}
        displayModal();
        {% endif %}
    </script>
</body>
</html>
